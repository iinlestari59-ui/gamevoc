        // --- WEB AUDIO SYNTHESIZER FOR SFX ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playBeep(freq = 440, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playCorrect() {
                if (!this.enabled) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    setTimeout(() => this.playBeep(freq, 'triangle', 0.15, 0.2), i * 80);
                });
            }
            playWrong() {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }
            playHover() {
                this.playBeep(400, 'sine', 0.05, 0.05);
            }
            playWinFanfare() {
                if (!this.enabled) return;
                const melody = [
                    { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 783.99, d: 0.15 },
                    { f: 1046.50, d: 0.4 }, { f: 880, d: 0.2 }, { f: 1046.50, d: 0.6 }
                ];
                let time = 0;
                melody.forEach(item => {
                    setTimeout(() => this.playBeep(item.f, 'triangle', item.d, 0.25), time * 1000);
                    time += item.d + 0.05;
                });
            }
        }

        // --- MAIN APP COMPONENT ---
        function NusantaraApp() {
            // Game Flow States
            const [gameState, setGameState] = useState('START'); // START, PLAYING, EXPLANATION, LEVEL_WIN, GAME_OVER
            const [gameMode, setGameMode] = useState('INDIVIDUAL'); // INDIVIDUAL, CLASS_CHALLENGE
            const [teamNames, setTeamNames] = useState({ team1: "Tim Diponegoro", team2: "Tim Pattimura" });
            const [currentTurn, setCurrentTurn] = useState('team1');
            const [teamScores, setTeamScores] = useState({ team1: 0, team2: 0 });

            // Questions & Level Progression
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [stats, setStats] = useState({ correct: 0, incorrect: 0, levelScores: [0,0,0,0,0] });
            const [shuffledQuestions, setShuffledQuestions] = useState([]);
            
            // Selection & Feedback
            const [selectedOption, setSelectedOption] = useState(null);
            const [feedbackState, setFeedbackState] = useState(null); // 'correct', 'wrong'
            const [isLocked, setIsLocked] = useState(false);

            // Audio & Screen Settings
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [showInstructions, setShowInstructions] = useState(false);
            const [showDiagnostics, setShowDiagnostics] = useState(false);
            
            // Camera & MediaPipe Tracking States
            const [cameraActive, setCameraActive] = useState(false);
            const [modelStatus, setModelStatus] = useState('Standby'); // Loading, Ready, Error, Off
            const [handDetected, setHandDetected] = useState(false);
            const [fingertipPos, setFingertipPos] = useState({ x: -100, y: -100 });
            const [normalizedLandmark, setNormalizedLandmark] = useState({ x: 0, y: 0 });
            const [targetedBee, setTargetedBee] = useState(null);
            const [dwellProgress, setDwellProgress] = useState(0);
            
            // Camera Tuning Settings
            const [sensitivity, setSensitivity] = useState(0.65); // EMA Alpha
            const [dwellTimeTarget, setDwellTimeTarget] = useState(1000); // Ms to complete click

            // Refs for Camera & MediaPipe Loop
            const videoRef = useRef(null);
            const canvasOverlayRef = useRef(null);
            const confettiCanvasRef = useRef(null);
            const landmarkerRef = useRef(null);
            const animFrameRef = useRef(null);
            const dwellStartTimeRef = useRef(null);
            const lastTargetRef = useRef(null);
            const smoothedPosRef = useRef({ x: 0.5, y: 0.5 });
            const answerCardsRef = useRef([]);

            // Sync Sound FX Toggle
            useEffect(() => {
                sfx.enabled = soundEnabled;
            }, [soundEnabled]);

            // Initialize Shuffled Questions on Game Start
            const startNewGame = (mode = 'INDIVIDUAL') => {
                setGameMode(mode);
                const shuffled = [...QUESTION_BANK].sort(() => Math.random() - 0.5);
                setShuffledQuestions(shuffled);
                setCurrentQuestionIdx(0);
                setScore(0);
                setStats({ correct: 0, incorrect: 0, levelScores: [0,0,0,0,0] });
                setTeamScores({ team1: 0, team2: 0 });
                setCurrentTurn('team1');
                setSelectedOption(null);
                setFeedbackState(null);
                setIsLocked(false);
                setGameState('PLAYING');
                sfx.playBeep(600, 'sine', 0.1);
            };

            // Canvas Confetti Burst Effect
            const triggerConfetti = () => {
                const canvas = confettiCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6'];
                for (let i = 0; i < 70; i++) {
                    particles.push({
                        x: canvas.width / 2,
                        y: canvas.height / 3,
                        vx: (Math.random() - 0.5) * 16,
                        vy: (Math.random() - 0.7) * 16,
                        size: Math.random() * 8 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * 360,
                        rotSpeed: (Math.random() - 0.5) * 10,
                        opacity: 1
                    });
                }

                let frame = 0;
                const renderParticles = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.4; // gravity
                        p.opacity -= 0.015;
                        p.rotation += p.rotSpeed;

                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.opacity);
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    });

                    frame++;
                    if (frame < 80) {
                        requestAnimationFrame(renderParticles);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                };
                renderParticles();
            };

            // Initialize MediaPipe Tasks Vision
            const initMediaPipe = async () => {
                if (landmarkerRef.current) return true;
                setModelStatus('Loading');
                try {
                    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
                    const filesetResolver = await vision.FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                    );
                    const handLandmarker = await vision.HandLandmarker.createFromOptions(filesetResolver, {
                        baseOptions: {
                            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 1
                    });
                    landmarkerRef.current = handLandmarker;
                    setModelStatus('Ready');
                    return true;
                } catch (err) {
                    console.error("Gagal memuat MediaPipe:", err);
                    setModelStatus('Error');
                    return false;
                }
            };

            // Toggle Camera Access & Tracking
            const toggleCamera = async () => {
                if (cameraActive) {
                    // Stop Camera
                    if (videoRef.current && videoRef.current.srcObject) {
                        const tracks = videoRef.current.srcObject.getTracks();
                        tracks.forEach(track => track.stop());
                        videoRef.current.srcObject = null;
                    }
                    if (animFrameRef.current) {
                        cancelAnimationFrame(animFrameRef.current);
                    }
                    setCameraActive(false);
                    setHandDetected(false);
                    return;
                }

                // Start Camera
                const ready = await initMediaPipe();
                if (!ready && modelStatus === 'Error') {
                    alert("Gagal memuat sistem pelacakan tangan MediaPipe. Pastikan koneksi internet stabil.");
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
                    });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        videoRef.current.onloadedmetadata = () => {
                            videoRef.current.play();
                            setCameraActive(true);
                        };
                    }
                } catch (err) {
                    console.error("Akses kamera ditolak atau tidak tersedia:", err);
                    alert("Kamera tidak dapat diakses. Mohon beri izin akses webcam pada browser Anda.");
                    setCameraActive(false);
                }
            };

            // Real-Time Frame Detection Loop
            const processVideoFrame = useCallback(() => {
                if (!videoRef.current || !landmarkerRef.current || videoRef.current.readyState < 2) {
                    animFrameRef.current = requestAnimationFrame(processVideoFrame);
                    return;
                }

                const video = videoRef.current;
                const startTimeMs = performance.now();
                const results = landmarkerRef.current.detectForVideo(video, startTimeMs);

                if (results.landmarks && results.landmarks.length > 0) {
                    setHandDetected(true);
                    const landmark8 = results.landmarks[0][8]; // Index Fingertip
                    
                    // Mirror X coordinate for natural mirror control
                    const rawX = 1 - landmark8.x;
                    const rawY = landmark8.y;
                    setNormalizedLandmark({ x: rawX, y: rawY });

                    // Exponential Moving Average (EMA) Smoothing
                    const currentSmoothed = smoothedPosRef.current;
                    const smoothedX = currentSmoothed.x * sensitivity + rawX * (1 - sensitivity);
                    const smoothedY = currentSmoothed.y * sensitivity + rawY * (1 - sensitivity);
                    smoothedPosRef.current = { x: smoothedX, y: smoothedY };

                    // Map to Window Screen Coordinates
                    const screenX = smoothedX * window.innerWidth;
                    const screenY = smoothedY * window.innerHeight;
                    setFingertipPos({ x: screenX, y: screenY });

                    // Check Collision / Hovering over Answer Bee Cards
                    if (gameState === 'PLAYING' && !isLocked) {
                        let hoveredIdx = null;
                        answerCardsRef.current.forEach((cardEl, idx) => {
                            if (!cardEl) return;
                            const rect = cardEl.getBoundingClientRect();
                            if (
                                screenX >= rect.left &&
                                screenX <= rect.right &&
                                screenY >= rect.top &&
                                screenY <= rect.bottom
                            ) {
                                hoveredIdx = idx;
                            }
                        });

                        setTargetedBee(hoveredIdx);

                        // Handle Dwell Selection Logic
                        if (hoveredIdx !== null) {
                            if (lastTargetRef.current !== hoveredIdx) {
                                // New target hovered
                                dwellStartTimeRef.current = performance.now();
                                lastTargetRef.current = hoveredIdx;
                                sfx.playHover();
                            } else {
                                // Calculate dwell progress
                                const elapsed = performance.now() - dwellStartTimeRef.current;
                                const progress = Math.min(100, (elapsed / dwellTimeTarget) * 100);
                                setDwellProgress(progress);

                                // Trigger selection on complete dwell
                                if (elapsed >= dwellTimeTarget && !isLocked) {
                                    handleSelectAnswer(hoveredIdx);
                                    dwellStartTimeRef.current = null;
                                    lastTargetRef.current = null;
                                    setDwellProgress(0);
                                }
                            }
                        } else {
                            // Reset Dwell
                            dwellStartTimeRef.current = null;
                            lastTargetRef.current = null;
                            setDwellProgress(0);
                        }
                    }
                } else {
                    setHandDetected(false);
                    setTargetedBee(null);
                    setDwellProgress(0);
                    dwellStartTimeRef.current = null;
                    lastTargetRef.current = null;
                }

                animFrameRef.current = requestAnimationFrame(processVideoFrame);
            }, [gameState, isLocked, sensitivity, dwellTimeTarget]);

            // Manage Detection Loop Animation Frame
            useEffect(() => {
                if (cameraActive) {
                    animFrameRef.current = requestAnimationFrame(processVideoFrame);
                } else {
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                }
                return () => {
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                };
            }, [cameraActive, processVideoFrame]);

            // Handle Answer Selection
            const handleSelectAnswer = (optionIndex) => {
                if (isLocked || gameState !== 'PLAYING') return;
                setIsLocked(true);
                setSelectedOption(optionIndex);

                const currentQ = shuffledQuestions[currentQuestionIdx];
                const isCorrect = optionIndex === currentQ.correctIndex;

                if (isCorrect) {
                    setFeedbackState('correct');
                    sfx.playCorrect();
                    triggerConfetti();

                    // Score calculation
                    if (gameMode === 'INDIVIDUAL') {
                        setScore(prev => prev + 100);
                        setStats(prev => {
                            const newLevelScores = [...prev.levelScores];
                            newLevelScores[currentQ.level - 1] += 100;
                            return {
                                ...prev,
                                correct: prev.correct + 1,
                                levelScores: newLevelScores
                            };
                        });

                        // Class mode team score
                        setTeamScores(prev => ({
                            ...prev,
                            [currentTurn]: prev[currentTurn] + 100
                        }));
                        setStats(prev => ({ ...prev, correct: prev.correct + 1 }));

                    setFeedbackState('wrong');
                    sfx.playWrong();
                    setStats(prev => ({ ...prev, incorrect: prev.incorrect + 1 }));

                    setGameState('EXPLANATION');

                setSelectedOption(null);
                setFeedbackState(null);
                setIsLocked(false);

                    setCurrentTurn(prev => (prev === 'team1' ? 'team2' : 'team1'));

                    setCurrentQuestionIdx(nextIdx);

                    // Check if Level Complete (Every 3 questions)

                        setGameState('LEVEL_WIN');

                        setGameState('PLAYING');

                    setGameState('GAME_OVER');

                                <button
                                    onClick={handleNextQuestion}
                                    className="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 py-4 rounded-2xl font-game font-bold text-xl shadow-xl transform active:scale-95 transition"
                                >
                                    LANJUT KE SOAL BERIKUTNYA ➔
                                </button>
                            </div>
                        )}

                        {/* 4. LEVEL WIN MODAL */}
                        {gameState === 'LEVEL_WIN' && (
                            <div className="w-full max-w-2xl bg-gradient-to-b from-slate-800 to-slate-900 border-4 border-emerald-500 rounded-3xl p-8 shadow-2xl text-center space-y-6">
                                <div className="text-6xl animate-bounce">🏆</div>
                                <h3 className="font-game font-extrabold text-3xl sm:text-4xl text-emerald-400">
                                    MISI {currentLevelNum} SELESAI!
                                </h3>
                                <p className="text-slate-200 text-lg">
                                    Selamat! Kamu berhasil menyelesaikan semua pertanyaan di level ini dengan sangat baik.
                                </p>
                                <button
                                    onClick={() => setGameState('PLAYING')}
                                    className="px-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-game font-bold text-xl rounded-2xl shadow-xl transform active:scale-95 transition"
                                >
                                    MULAI LEVEL BERIKUTNYA ➔
                                </button>
                            </div>
                        )}

                        {/* 5. GAME OVER / CERTIFICATE SCREEN */}
                        {gameState === 'GAME_OVER' && (
                            <div className="w-full max-w-3xl bg-slate-800 border-4 border-amber-500 rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-6">
                                <div className="text-6xl animate-bounce">👑</div>
                                <h2 className="font-game font-extrabold text-3xl sm:text-5xl text-amber-400">
                                    PETUALANGAN SELESAI!
                                </h2>

                                {/* Score Summary */}
                                {gameMode === 'INDIVIDUAL' ? (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-700 grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                                        <div>
                                            <span className="text-xs text-slate-400 block">TOTAL SKOR</span>
                                            <span className="font-game text-3xl text-yellow-400 font-bold">{score}</span>
                                        </div>
                                        <div>
                                            <span className="text-xs text-slate-400 block">BENAR</span>
                                            <span className="font-game text-3xl text-emerald-400 font-bold">{stats.correct}</span>
                                        </div>
                                        <div>
                                            <span className="text-xs text-slate-400 block">SALAH</span>
                                            <span className="font-game text-3xl text-rose-400 font-bold">{stats.incorrect}</span>
                                        </div>
                                        <div>
                                            <span className="text-xs text-slate-400 block">AKURASI</span>
                                            <span className="font-game text-3xl text-sky-400 font-bold">{Math.round((stats.correct / 15) * 100)}%</span>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-slate-900 p-6 rounded-2xl border border-slate-700 space-y-4">
                                        <h3 className="font-bold text-amber-400 text-lg">HASIL TANTANGAN KELAS</h3>
                                        <div className="flex justify-around items-center">
                                            <div className="text-center">
                                                <div className="text-slate-300 font-bold">{teamNames.team1}</div>
                                                <div className="font-game text-4xl text-amber-400 font-extrabold">{teamScores.team1} Pts</div>
                                            </div>
                                            <div className="text-2xl font-bold text-slate-500">VS</div>
                                            <div className="text-center">
                                                <div className="text-slate-300 font-bold">{teamNames.team2}</div>
                                                <div className="font-game text-4xl text-sky-400 font-extrabold">{teamScores.team2} Pts</div>
                                            </div>
                                        </div>
                                        <div className="text-emerald-400 font-bold text-lg pt-2 border-t border-slate-800">
                                            {teamScores.team1 > teamScores.team2 ? `🎉 PEMENANG: ${teamNames.team1}!` : teamScores.team2 > teamScores.team1 ? `🎉 PEMENANG: ${teamNames.team2}!` : "🤝 HASIL SERI! KEDUA TIM HEBAT!"}
                                        </div>
                                    </div>
                                )}

                                {/* Badge Earned */}
                                <div className="bg-gradient-to-r from-amber-500/20 via-yellow-500/20 to-amber-500/20 p-4 rounded-2xl border border-amber-500/40">
                                    <span className="text-xs text-amber-300 font-bold uppercase tracking-wider block">Gelar Penjelajah Sejarah:</span>
                                    <span className="font-game text-2xl text-amber-400 font-bold">{getBadgeTitle(score)}</span>
                                </div>

                                {/* Action Buttons */}
                                <div className="flex flex-wrap items-center justify-center gap-4 pt-4">
                                    <button
                                        onClick={() => startNewGame(gameMode)}
                                        className="px-6 py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-game font-bold text-lg rounded-2xl shadow-lg transform active:scale-95 transition flex items-center space-x-2"
                                    >
                                        <span>🔄</span> <span>MAIN LAGI</span>
                                    </button>

                                    <button
                                        onClick={downloadHTMLFile}
                                        className="px-6 py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-game font-bold text-lg rounded-2xl shadow-lg transform active:scale-95 transition flex items-center space-x-2"
                                    >
                                        <span>💾</span> <span>UNDUH FILE HTML GAME</span>
                                    </button>

                                    <button
                                        onClick={() => setGameState('START')}
                                        className="px-6 py-3.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-game font-bold text-lg rounded-2xl shadow-lg transform active:scale-95 transition"
                                    >
                                        MENU UTAMA
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* INSTRUCTIONS MODAL */}
                    {showInstructions && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-800 border-2 border-amber-500 rounded-3xl p-6 sm:p-8 max-w-2xl w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between border-b border-slate-700 pb-3">
                                    <h3 className="font-game font-bold text-2xl text-amber-400 flex items-center space-x-2">
                                        <span>📜</span> <span>PETUNJUK PERMAINAN</span>
                                    </h3>
                                    <button onClick={() => setShowInstructions(false)} className="text-slate-400 hover:text-white text-xl">✕</button>
                                </div>

                                <div className="space-y-3 text-sm text-slate-200 leading-relaxed">
                                    <div className="flex items-start space-x-3 bg-slate-900 p-3 rounded-xl">
                                        <span className="text-2xl">📷</span>
                                        <div>
                                            <strong className="text-amber-300 block">1. Menggunakan Kamera & Ujung Jari Telunjuk</strong>
                                            Aktifkan kamera lalu arahkan satu tangan ke depan layar. Gerakkan kursor kuning dengan menggerakkan ujung jari telunjuk (landmark #8).
                                        </div>
                                    </div>

                                    <div className="flex items-start space-x-3 bg-slate-900 p-3 rounded-xl">
                                        <span className="text-2xl">🐝</span>
                                        <div>
                                            <strong className="text-amber-300 block">2. Memilih Lebah Jawaban</strong>
                                            Arahkan kursor lingkaran kuning ke salah satu lebah pilihan (A, B, atau C). Tahan posisi jari selama 1 detik sampai lingkaran hitung mundur penuh.
                                        </div>
                                    </div>

                                    <div className="flex items-start space-x-3 bg-slate-900 p-3 rounded-xl">
                                        <span className="text-2xl">🖱️</span>
                                        <div>
                                            <strong className="text-amber-300 block">3. Mode Alternatif Touch / Mouse</strong>
                                            Jika perangkat tidak memiliki kamera atau sensor dinonaktifkan, siswa tetap bisa memilih lebah jawaban langsung dengan klik mouse atau sentuhan layar IFP/tablet.
                                        </div>
                                    </div>

                                    <div className="flex items-start space-x-3 bg-slate-900 p-3 rounded-xl">
                                        <span className="text-2xl">🏆</span>
                                        <div>
                                            <strong className="text-amber-300 block">4. Sistem Skor & Misi Sejarah</strong>
                                            Setiap jawaban benar memberikan +100 poin. Terdapat 15 soal seputar materi VOC, Tanam Paksa, Politik Etis, dan Pahlawan Sejarah SD Kelas VI.
                                        </div>
                                    </div>
                                </div>

                                <button
                                    onClick={() => setShowInstructions(false)}
                                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 py-3 rounded-2xl font-game font-bold text-lg transition"
                                >
                                    SAYA MENGERTI, SIAP BERMAIN!
                                </button>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-slate-950/80 border-t border-slate-800 py-3 px-4 text-center text-xs text-slate-400 z-20">
                        PETUALANGAN SEJARAH NUSANTARA — Media Pembelajaran Interaktif Kelas VI SD • Sensor Gerak Kamera Web Real-Time
                    </footer>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NusantaraApp />);
    </script>
</body>
</html>
